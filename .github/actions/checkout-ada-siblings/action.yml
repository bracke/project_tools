name: Check out Ada sibling crates
description: >
  Clone the transitive closure of path-pinned sibling crates next to the root
  repo, driven by the alire.toml pins themselves (root and sub-crate manifests)
  rather than a hand-maintained checkout list. This keeps a repo's CI correct
  when the dependency graph changes -- a new transitive pin is picked up
  automatically instead of silently breaking the build.

  Assumptions matching this workspace: crates are flat siblings under the GitHub
  workspace, each pinned as `{ path = "../name" }` (or `../../name` from a
  sub-crate), the pin's final path component is the sibling's repo name, and the
  repos are public (cloned unauthenticated). The root repo must already be
  checked out (e.g. via actions/checkout with `path: <root>`).

inputs:
  root:
    description: Directory name of the already-checked-out root repo.
    required: true
  owner:
    description: GitHub owner to clone siblings from.
    required: false
    default: ${{ github.repository_owner }}

runs:
  using: composite
  steps:
    - name: Check out sibling crates (transitive pin closure)
      shell: bash
      env:
        ROOT_REPO: ${{ inputs.root }}
        SIBLING_OWNER: ${{ inputs.owner }}
      # No associative or indexed arrays: macOS runners ship bash 3.2, so the
      # visited-set and work-queue are space-delimited strings.
      run: |
        set -euo pipefail
        ws="${GITHUB_WORKSPACE:-$PWD}"
        seen=" "
        queue="$ROOT_REPO"
        while [ -n "$queue" ]; do
          repo="${queue%% *}"
          if [ "$repo" = "$queue" ]; then queue=""; else queue="${queue#* }"; fi
          case "$seen" in *" $repo "*) continue;; esac
          seen="$seen$repo "
          dir="$ws/$repo"
          [ -d "$dir" ] || continue
          # Sibling repo names = final component of every "../name" path pin in
          # any alire.toml under this repo (covers sub-crate manifests too).
          sibs=$(find "$dir" -name alire.toml -exec \
                   grep -hoE '"(\.\./)+[A-Za-z0-9_]+"' {} + 2>/dev/null \
                 | tr -d '"' | sed 's#.*/##' | sort -u || true)
          for sib in $sibs; do
            if [ ! -e "$ws/$sib" ]; then
              # A pin can reference a crate this CI job does not build (a private
              # or optional sibling the curated hand-lists deliberately omitted).
              # Skip a clone that fails rather than aborting: the build itself
              # then fails only if a genuinely-needed sibling is truly missing.
              if git clone --depth 1 "https://github.com/$SIBLING_OWNER/$sib.git" "$ws/$sib" 2>/dev/null; then
                echo "checkout-ada-siblings: cloned $SIBLING_OWNER/$sib (pinned via $repo)"
              else
                echo "checkout-ada-siblings: skipped $SIBLING_OWNER/$sib (unavailable; pinned via $repo)"
                continue
              fi
            fi
            case "$seen $queue " in *" $sib "*) ;; *) queue="$queue $sib";; esac
          done
        done
    - name: Compute an OS-stable CLDR cache key
      id: cldr_key
      if: hashFiles('i18n/cldr/upstream/source_manifest.txt') != ''
      shell: bash
      run: |
        set -euo pipefail
        # hashFiles() diverges across runners: git checks the manifest out with
        # CRLF on Windows and LF elsewhere, so a content hash differs by OS and a
        # Linux-seeded cache would never match the Windows key. Normalize line
        # endings (tr -d '\r') before hashing so the key is byte-identical on
        # every runner -- one shared cross-OS cache entry. git is on every runner
        # and git hash-object works outside a repository.
        h=$(tr -d '\r' < "$GITHUB_WORKSPACE/i18n/cldr/upstream/source_manifest.txt" | git hash-object --stdin)
        echo "key=cldr-json-$h" >> "$GITHUB_OUTPUT"
    - name: Cache the i18n CLDR upstream tree (CI-only; avoids the flaky 82 MB download)
      # Building a transitive i18n dependency regenerates its data, which on a
      # fresh CI checkout downloads the 82 MB cldr-json release from the GitHub
      # release CDN. That fetch reaches Windows runners only intermittently,
      # while Linux and macOS get it reliably. With the OS-stable key above and
      # enableCrossOsArchive (cldr-json is portable JSON), the reliable
      # Linux/macOS download seeds one shared entry the Windows job restores --
      # taking Windows out of the download path from the next run onward. Gated
      # on the manifest, so the step is inert in repos where i18n is not in the
      # pin closure. The key is an exact (normalized) manifest hash with no
      # restore-keys fallback, so a cldr_version bump refetches instead of
      # serving a stale tree; cldr-json installs atomically (staging dir +
      # rename), so the cache only ever holds a complete tree.
      if: steps.cldr_key.outputs.key != ''
      uses: actions/cache@v4
      with:
        path: i18n/cldr/upstream/cldr-json
        key: ${{ steps.cldr_key.outputs.key }}
        enableCrossOsArchive: true
