name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux-release-check:
    name: Linux release checklist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Alire
        uses: alire-project/setup-alire@v5
        with:
          # gnatprove comes from Alire's toolchain, not apt: Ubuntu has no reliable
          # gnatprove package, which is why the previous apt-based job failed at install.
          toolchain: gnat_native=15.2.1 gnatprove gprbuild
      - name: Build library
        # Generates config/project_tools_config.gpr, which project_tools.gpr withs and
        # which is gitignored (Alire-generated). A raw gprbuild would fail without it.
        run: alr --non-interactive build
      - name: Run GNATprove
        run: alr exec -- gnatprove -P project_tools.gpr --level=0 --mode=check
      - name: Build tests
        # tests is its own Alire root (it depends on aunit), so it builds from there.
        working-directory: tests
        run: alr --non-interactive build
      - name: Run tests
        run: ./tests/bin/project_tools_tests
      - name: Build public API smoke
        run: alr exec -- gprbuild -P public_api_smoke/project_tools_public_api_smoke.gpr
