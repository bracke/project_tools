name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux-release-check:
    name: Linux release checklist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Alire
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native=15.2.1 gprbuild
      - name: Install GNATprove
        # gnatprove is a regular Alire crate, not a toolchain component, so it installs
        # separately (apt has no reliable gnatprove package -- the old cause of failure).
        run: |
          alr install gnatprove
          echo "$HOME/.alire/bin" >> "$GITHUB_PATH"
      - name: Build library
        # Generates config/project_tools_config.gpr, which project_tools.gpr withs and
        # which is gitignored (Alire-generated). A raw gprbuild would fail without it.
        run: alr --non-interactive build
      - name: Run GNATprove
        run: alr exec -- gnatprove -P project_tools.gpr --level=0 --mode=check
      - name: Build tests
        # tests is its own Alire root (it depends on aunit), so it builds from there.
        working-directory: tests
        run: alr --non-interactive build
      - name: Run tests
        run: ./tests/bin/project_tools_tests
      - name: Build public API smoke
        # public_api_smoke is its own Alire root; its gpr withs config/<crate>_config.gpr,
        # which resolves only inside that crate. Build it there, as tests is built above.
        working-directory: public_api_smoke
        run: alr --non-interactive build
