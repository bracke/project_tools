name = "project_tools"
description = "Shared Project release and test tooling helpers"
version = "0.1.0"
website = "https://github.com/bracke/project_tools"
authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT"
long-description = "project_tools provides small reusable helpers for Ada project check programs: text searches, filesystem predicates, raw file comparisons, and process execution helpers. Project-specific release policy remains in each project driver."

tags = ["ada", "tooling", "release", "tests"]

[[depends-on]]
gnat_native = "=15.2.1"

# Build dependencies in the development profile (-Og) too, not the default
# release (-O3), so roots that share these crates share object files rather
# than forcing each other into full rebuilds.
[build-profiles]
"*" = "development"

[[actions]]
type = "test"
command = ["sh", "-c", "cd tests && alr build && ./bin/project_tools_tests"]
