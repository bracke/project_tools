name = "project_tools_check_all"
description = "release checklist for project_tools"
version = "0.1.0-dev"

executables = ["check_all", "optional_tool", "check_generated_artifacts"]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
project_tools = "*"

[[pins]]
project_tools = { path = ".." }

# Build dependencies in the development profile (-Og) too, not the default
# release (-O3), so this root and the parent share project_tools object files
# rather than forcing each other into full rebuilds.
[build-profiles]
"*" = "development"
